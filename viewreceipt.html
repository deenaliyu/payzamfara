  <style>

      padding-left: 0;

      display: none;
    }

<body>
  <section class="flex h-[100vh] overflow-y-scroll flex justify-center ">


      <section class="pb-5">
        
        <div class="flex align-items-center gap-1 my-4 pb-8">
            <a type="button" style='color: #005826; font-weight: 500;' onclick='history.back(-1)' class="text-[18px]">Back</a>
          </div>
        <div class="invoiceContainer flex justify-center mt-5">
          <div class="invoice bg-white w-[100%] shadow-md -mt-12" id="receiptCard">
                
            <div class="flex justify-center items-center mt-4" id="loader">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-gray-900"></div>
            </div>
            
          </div>
          <!-- RECEIPT -->
          <!-- RECEIPT WILL BE HERE -->


        </div>

        <div class="flex justify-center pr-10">
          <div class="w-[100%] mb-4">
            <!-- <div class="mt-4">
              <p class="text-xl">Note: You can make part payment by editing amount you are to pay</p>
            </div> -->
            <div class="flex justify-between mt-4 space-x-3">
              <button class="outline-btn flex gap-3 items-center px-10" onclick="downloadInvoice('receiptCard')">
                <iconify-icon icon="fa6-solid:download" class="text-xl"></iconify-icon>
                <span>Download Receipt</span>
              </button>

              <button class="outline-btn flex gap-3 items-center px-10" onclick="printInvoice('receiptCard')">
                <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                <span>Print E-Receipt</span>
              </button>
              
              
            </div>
          </div>
        </div>



      </section>


  </section>
