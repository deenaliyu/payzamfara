<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeGuage</title>

  <!-- FAVION ICON -->
  <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/responsive.css" />
  <link rel="stylesheet" href="assets/fontawesome/css/all.css" />
  <link rel="stylesheet" href="assets/js/aos-master/dist/aos.css" />
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.5.3/jspdf.min.js"></script>
  <script type="text/javascript" src="https://html2canvas.hertzen.com/dist/html2canvas.js"></script>

  <style>
    .formTabs {
      display: none;
    }

    .imgTabs {
      display: none;
    }

    .invTa tr td {
      padding-left: 0;
      padding-bottom: 0px;
      font-size: 14px;
    }
  </style>

<body>
  <header class="flex justify-between px-10 bg-white py-3" id="theHeader"></header>

  <section class="flex h-[89vh] overflow-y-scroll headerBeginner">

    <div class="md:block hidden w-3/12 bg-[#F9FAFB] p-3">

      <div class="flex px-1 h-full">
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv1.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv2.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv2.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv3.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv4.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv5.png" />
        </div>
      </div>

    </div>

    <div class="md:w-9/12 w-full bg-[url('./assets/img/slideimg.png')] bg-center overflow-y-scroll">
      <section class="formTabs h-full">

        <div class="flex justify-center items-center h-full">

          <form action="" class="md:w-[60%] w-[80%]">
            <div id="text-color">
              <h1 class="fontBold text-3xl">Generate Presumptive Invoice</h1>
              <h1 class="mb-10 mt-3">Personal Details</h1>
            </div>

            <div class="form-group mb-3">
              <label for="tin/email">Enter Tin or Email*</label>
              <input type="text" class="form-control" id="tinOrEmail" required>
            </div>

            <div class="form-group flex gap-4 mt-10" id="theFetchBtns">
              <button type="button" id="last-button" onclick="fillManually()">Fill Manually</button>
              <button id="lastly-button" onclick="fetchUserDetails()" class="btn-only" type="button">Fetch
                Details</button>
            </div>
            <div id="msg_box001"></div>

          </form>

        </div>
      </section>

      <section class="formTabs h-full">

        <div class="flex justify-center items-center h-full">

          <form action="" class="md:w-[60%] w-[80%] ">
            <h1 class="fontBold text-2xl">Generate Presumptive</h1>
            <h1 class="mb-3 mt-3">Personal Details</h1>

            <div class="form-group mb-4">
              <label for="">Select your category*</label>
              <select class="form-select payInputs selCateg" required id="category">
                <option disabled selected>Select--</option>
                <option value="2">Individual</option>
                <option value="1">Corporate</option>
                <option value="3">State Agency</option>
                <option value="4">Federal Agency</option>
              </select>
            </div>
            <div class="flex items-center mb-4 gap-2" id="theName">
              <div class="form-group w-full">
                <label for="">First name *</label>
                <input type="text" class="form-control payInputs" required data-name="first_name"
                  placeholder="Enter your first name">
              </div>

              <div class="form-group w-full">
                <label for="">Surname *</label>
                <input type="text" class="form-control payInputs" required data-name="surname"
                  placeholder="Enter your surname">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2" id="theEmail">
              <div class="form-group w-full">
                <label for="">Email *</label>
                <input type="text" class="form-control payInputs" required data-name="email"
                  placeholder="Enter your Email Address">
              </div>

              <div class="form-group w-full">
                <label for="">Phone number *</label>
                <input type="number" class="form-control payInputs" id="phonenumber" minlength="11" maxlength="11"
                  required data-name="phone" placeholder="Your 11-digits phone number">
              </div>
            </div>

            <div class="form-group w-full mb-4" id="theTin">
              <label for="">TIN </label>
              <input type="text" class="form-control payInputs" id="tin" data-name="tin" placeholder="Enter your TIN">
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">State*</label>
                <select name="" id="selectState" class="form-select payInputs" data-name="state">
                  <option value="Akwa Ibom">Akwa Ibom</option>
                </select>
              </div>

              <div class="form-group w-full">
                <label for="">LGA*</label>
                <select name="" id="selectLGA" class="form-select payInputs" required data-name="lga">
                </select>
              </div>

              <div class="form-group w-full" id="theLga">
                <label for="">Address*</label>
                <input type="text" class="form-control payInputs" minlength="10" required data-name="address"
                  placeholder=" Enter your address">
              </div>
            </div>




            <button class="button w-full" type="button" onclick="continuePage()">Continue</button>
          </form>

        </div>
      </section>

      <section class="formTabs h-full">
        <div class="pt-10 md:px-10 px-4">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>
        <div class="flex justify-center items-center h-full -mt-10">

          <form action="" class="md:w-[70%] secondForm">
            <h1 class="fontBold text-2xl">Generate Presumptive</h1>
            <h1 class="mb-3 mt-3">Business Information</h1>

            <div class="flex gap-3 md:flex-row flex-col mb-3">

              <div class="form-group md:w-6/12">
                <label for="">Type of Business*</label>
                <select class="form-select enumInputB" id="busiType" data-name="business_type" required>
                  <option value="">Select ---</option>
                </select>
              </div>

              <div class="form-group md:w-6/12">
                <label for="">Category*</label>
                <select class="form-select enumInputB" data-name="business_category" required id="business_category">
                  <option value=""></option>
                  <option value="Trading">Trading</option>
                  <option value="Manufacturing">Manufacturing</option>
                  <option value="Services">Services</option>

                </select>
              </div>

            </div>

            <div class="form-group mt-4">
              <label for="">Staff Quota*</label>
              <select class="form-select enumInputB" data-name="staff_quota" required id="staffQuota">
                <option value=""></option>
                <option value="1-5">1-5 Staff</option>
                <option value="6-20">6-20 Staff</option>
                <option value="21">21+ Staff</option>
              </select>
            </div>

            <div class="form-group mb-3 mt-1">
              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="developmentLevy" value="developmentLevy">
                <label class="form-check-label" for="developmentLevy">Development Levy</label>
              </div>

              <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="bprCheckInput" value="bprCheckInput">
                <label class="form-check-label" for="bprCheckInput">BPR</label>
              </div>

              <div class="form-group row mb-4 mt-2" id="devLevyContainer"></div>

              <div class="form-group row" id="bprCheckContainer"></div>
            </div>

            <!-- <div class="flex justify-end">
              <button onclick="addBusiness()" type="button" class="text-sm flex items-center">
                <iconify-icon icon="ion:add-outline"></iconify-icon>
                <span> Add Business</span>
              </button>
            </div> -->

            <!-- <div id="businessCnt" class="mt-2"></div> -->

            <div class="form-group mb-3">
              <label for="description">Description*</label>
              <input type="text" class="form-control genInv" id="thedescripInput" required>
            </div>

            <button class="button w-full" type="button" onclick="goToPreviewPage()">Continue</button>


          </form>

        </div>
      </section>

      <section class="formTabs h-full">

        <div class="md:pt-20 md:px-10 px-4">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div class="flex justify-center items-center h-full">
          <form action="" class="md:w-[70%] secondForm">
            <!-- <h1 class="fontBold text-2xl">Generate Direct Assessment</h1> -->

            <h1 class="mb-3 mt-3">Billing Details</h1>
            <div class="shadow-md p-3 bg-[#E9ECEF]" id="bill">
              <div class="flex space-x-3">
                <p></p>
                <p></p>
              </div>
            </div>
            <h1 class="mb-3 mt-3">User Details</h1>
            <div class="flex items-center mb-4 gap-2" id="theName2">
              <div class="form-group w-full">
                <label for="">First name</label>
                <input type="text" class="form-control payInputs2" readonly data-name="first_name">
              </div>

              <div class="form-group w-full">
                <label for="">Surname</label>
                <input type="text" class="form-control payInputs2" readonly data-name="surname">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">Email</label>
                <input type="text" class="form-control payInputs2" readonly data-name="email">
              </div>

              <div class="form-group w-full">
                <label for="">Phone number *</label>
                <input type="text" class="form-control payInputs2" readonly data-name="phone">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">TIN</label>
                <input type="text" class="form-control payInputs2" readonly data-name="tin">
              </div>

              <div class="form-group w-full">
                <label for="">State</label>
                <input type="text" class="form-control payInputs2" readonly data-name="state">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">LGA</label>
                <input type="text" class="form-control payInputs2" readonly data-name="lga">
              </div>

              <div class="form-group w-full">
                <label for="">Address</label>
                <input type="text" class="form-control payInputs2" readonly data-name="address">
              </div>
            </div>




            <button class="button w-full" type="button" id="generating_inv"
              onclick="generateInvoiceNon()">Continue</button>
            <div id="msg_box"></div>
          </form>
        </div>
      </section>


      <section class="formTabs pb-5">
        <div class="md:pt-10 pt-3 md:px-10 px-4">
          <!-- <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button> -->
        </div>

        <div class="invoiceContainer flex justify-center">

          <div class="invoice bg-white md:w-[70%] w-[90%] shadow-md md:-mt-12 mt-2" id="invoiceCard">
            <!-- COMING FROM JS invoice.js -->
          </div>


        </div>

        <div class="flex justify-center px-4">
          <div>
            <div class="mt-4">
              <p class="text-xl">Note: You can make part payment by editing amount you are to pay</p>
            </div>
            <div class="flex justify-between flex-wrap mt-4 gap-3">
              <div class="flex gap-3 items-center">
                <button class="outline-btn flex gap-3 items-center px-10" onclick="downloadInvoice('invoiceCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Download Invoice</span>
                </button>

                <button class="outline-btn flex gap-3 items-center px-10" onclick="printInvoice('invoiceCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Print Invoice</span>
                </button>
              </div>

              <button class="button flex gap-3 items-center px-10" onclick="goToPayment2()">
                <span>Proceed</span>
                <iconify-icon icon="eva:arrow-forward-outline" class="text-xl"></iconify-icon>
              </button>
            </div>
          </div>
        </div>



      </section>

      <section class="formTabs pb-5">
        <div class="pt-10 px-10">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div id="makePayment">

          <!-- PAYMENT DESIGN COMING FROM PAYMENT.js -->
        </div>


      </section>

      <section class="formTabs pb-5">
        <div class="pt-10 px-10">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div class="invoiceContainer flex justify-center pr-10">
          <div class="invoice bg-white w-[70%] shadow-md" id="receiptCard">

          </div>
        </div>

        <div class="flex justify-center pr-10">
          <div class="w-[70%]">
            <!-- <div class="mt-4">
              <p class="text-xl">Note: You can make part payment by editing amount you are to pay</p>
            </div> -->
            <div class="flex justify-between flex-wrap mt-4">
              <div class="flex gap-3 items-center">
                <button class="outline-btn flex gap-3 items-center px-10" onclick="downloadInvoice('receiptCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Download Receipt</span>
                </button>

                <button class="outline-btn flex gap-3 items-center px-10" onclick="printInvoice('receiptCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Print Receipt</span>
                </button>
              </div>

              <a href="index.html" class="button flex gap-3 items-center px-10">
                <span>Return to home page</span>
                <iconify-icon icon="eva:arrow-forward-outline" class="text-xl"></iconify-icon>
              </a>
            </div>
          </div>
        </div>



      </section>

    </div>

  </section>

      //change selectboxes to selectize mode to be searchable
