  <!-- Revenue Rate Modal -->

            </div>
            <div class="mb-3">

                <option value="">Select Business Type</option>
                <!-- Business types will be loaded here -->
              </select>
            </div>
            <div class="mb-3">
              <label for="revenueRateGroup" class="form-label">Group</label>
              <select class="form-select" id="revenueRateGroup" required>
                <option value="">Select Group</option>
                <option value="1">Group A</option>
                <option value="2">Group B</option>
                <option value="3">Group C</option>
                <option value="4">Group D</option>
                <option value="5">Group E</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="revenueRateAmount" class="form-label">Amount</label>
              <input type="number" class="form-control" id="revenueRateAmount" required>
            </div>
            <div class="mb-3">
              <label for="revenueRateFrequency" class="form-label">Frequency</label>
              <select class="form-select" id="revenueRateFrequency" required>
                <option value="">Select Frequency</option>
                <option value="monthly">Monthly</option>
                <option value="quarterly">Quarterly</option>
                <option value="annually">Annually</option>
                <option value="one-off">One-off</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">

          <button type="button" class="btn btn-primary" onclick="saveRevenueRate()">Save</button>
        </div>
