<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payzamfara</title>

  <!-- FAVION ICON -->
  <link rel="shortcut icon" href="../assets/img/favicon.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.css" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/responsive.css" />
  <link rel="stylesheet" href="../assets/fontawesome/css/all.css" />
  <link rel="stylesheet" href="../assets/js/aos-master/dist/aos.css" />
  <link ref="stylesheet" href="./assets/css/print2.css" media="print" />
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.5.3/jspdf.min.js"></script>
  <script type="text/javascript" src="https://html2canvas.hertzen.com/dist/html2canvas.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />


  <style>
    .formTabs {
      display: none;
    }

    .imgTabs {
      display: none;
    }

    table.invTable {
      border-collapse: collapse;
    }

    table.invTable th,
    table.invTable td {
      border: 1px solid #000;
    }

    .invTa tr td {
      padding-left: 0;
      padding-bottom: 0px;
      font-size: 14px;
    }

    #lastly-button {
      background-color: #fff;
      width: 380px;
      color: #025826 !important;
      border: 3px solid #025826;
      border-radius: 100px;
      padding: 10px 20px;
      text-align: center;
    }

    #last-button {
      background-color: #025826;
      width: 380px;
      color: #fff !important;
      border: 3px solid #025826;
      border-radius: 100px;
      padding: 10px 20px;
      text-align: center;
    }

    /* .demanInvoiceBody {
      background: url('./assets/img/demandbg.png');
      background-size: cover;
      background-position: center;
    } */

    .select2.select2-container {
      width: 100% !important;
    }

    #myTab .nav-link.active {
      background: #025826 !important;
    }
  </style>
</head>

<body>


  <section class="flex md:h-[100vh] overflow-y-scroll">

    <div class="md:block hidden w-3/12 bg-[#F9FAFB] p-3">

      <div class="flex px-1 h-full">
        <div class="mt-5 imgTabs">
          <img src="./assets/img/dmdimg3.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/dmdimg3.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/dmdimg3.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/dmdimg4.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/dmdimg5.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/dmdimg5.png" />
        </div>
      </div>

    </div>

    <div class="md:w-9/12 w-full bg-[url('../assets/img/slideimg.png')] bg-center overflow-y-scroll">

      <section class="formTabs h-full">
        <div class="pt-10 md:px-10 px-4">
          <button class="flex items-center gap-2" onclick="window.location.href='direct-assessment.html'">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>
        <div class="flex justify-center items-center h-full">

          <form action="" class="md:w-[70%] w-[95%]">
            <h1 class="fontBold text-2xl">Direct Assessment Reassessment</h1>
            <h1 class="mb-3 mt-3">Billing Information</h1>

            <div class="flex gap-3 mb-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="grossInptt" id="monthlyGrossInput" value="monthly">
                <label class="form-check-label" for="monthlyGrossInput">
                  Monthly Gross Income
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="grossInptt" id="AnnualGrossInput" value="annual"
                  checked>
                <label class="form-check-label" for="AnnualGrossInput">
                  Annual Gross Income
                </label>
              </div>

              <div class="form-check">
                <input class="form-check-input" type="radio" name="grossInptt" id="TaxLiabilityInput"
                  value="tax_liability">
                <label class="form-check-label" for="TaxLiabilityInput">
                  Tax Liability
                </label>
              </div>
            </div>

            <div class="form-group mb-4" id="grossContainer">
              <label for="basic_salary">Annual Gross Income*</label>
              <input type="number" placeholder="Input the annual gross income" class="form-control genInv directInputs"
                id="basic_salary" required data-name="basic_salary" onblur="calculateTaxLiability('yearly')"
                data-version="annual">
            </div>


            <div id="theCalDisContainer" class="">

            </div>


            <div class="form-group mb-4">
              <label for="description">Description*</label>
              <textarea class="form-control genInv" id="description" required data-name="description"></textarea>
            </div>

            <button class="button w-full" id="generating_inv" type="button"
              onclick="generateInvoiceNon()">Continue</button>

            <div id="msg_box"></div>
          </form>

        </div>
      </section>

      <section class="formTabs h-full">

        <div class="md:pt-20 md:px-10 px-4">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div class="flex justify-center items-center h-full">
          <form action="" class="md:w-[70%] secondForm">
            <!-- <h1 class="fontBold text-2xl">Generate Direct Assessment</h1> -->

            <h1 class="mb-3 mt-3">Billing Details</h1>
            <div class="shadow-md p-3 bg-[#E9ECEF]" id="bill">
              <div class="flex space-x-3">
                <p></p>
                <p></p>
              </div>
            </div>
            <h1 class="mb-3 mt-3">User Details</h1>
            <div class="flex items-center mb-4 gap-2" id="theName2">
              <div class="form-group w-full">
                <label for="">First name</label>
                <input type="text" class="form-control payInputs2" readonly data-name="first_name">
              </div>

              <div class="form-group w-full">
                <label for="">Surname</label>
                <input type="text" class="form-control payInputs2" readonly data-name="surname">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">Email</label>
                <input type="text" class="form-control payInputs2" readonly data-name="email">
              </div>

              <div class="form-group w-full">
                <label for="">Phone number *</label>
                <input type="text" class="form-control payInputs2" readonly data-name="phone">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">TIN</label>
                <input type="text" class="form-control payInputs2" readonly data-name="tin">
              </div>

              <div class="form-group w-full">
                <label for="">State</label>
                <input type="text" class="form-control payInputs2" readonly data-name="state">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">LGA</label>
                <input type="text" class="form-control payInputs2" readonly data-name="lga">
              </div>

              <div class="form-group w-full">
                <label for="">Address</label>
                <input type="text" class="form-control payInputs2" readonly data-name="address">
              </div>
            </div>




            <button class="button w-full" type="button"
              onclick="generateInvoiceNon()">Continue</button>
            <!-- <div id="msg_box"></div> -->
          </form>
        </div>
      </section>


    </div>

  </section>




  <script src="../assets/js/jquery.js"></script>
  <script src="../assets/bootstrap/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/js/select2.min.js"></script>
  <script src="../assets/js/sweetalert2/dist/sweetalert2.all.min.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.2/iconify-icon.min.js"></script>

  <script src="https://cdn.jsdelivr.net/gh/Joe12387/detectIncognito@main/dist/es5/detectIncognito.min.js"></script>
  <script>
    $(document).ready(function () {
      //change selectboxes to selectize mode to be searchable
      $(".revHeadInputSel").select2();
    });
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>


  <script src="assets/js/nav.js?v=1.0"></script>
  <!--<script src="assets/js/payment.js?v=1.6"></script>-->
  <script src="../assets/js/tabHandler.js"></script>
  <script src="../assets/js/invoice.js"></script>
  <script src="assets/js/direct-assessmentedit.js"></script>

</body>

</html>
