<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeGuage</title>

  <!-- FAVION ICON -->
  <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=1.0" />
  <link rel="stylesheet" href="assets/css/responsive.css" />

  <link rel="stylesheet" href="assets/js/aos-master/dist/aos.css" />
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.5.3/jspdf.min.js"></script>
  <script type="text/javascript" src="https://html2canvas.hertzen.com/dist/html2canvas.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/select2@4.0.13/dist/css/select2.min.css" rel="stylesheet" />

  <style>
    .formTabs {
      display: none;
    }

    .imgTabs {
      display: none;
    }

      padding-left: 0;

      font-size: 14px;
    }

<body>
  <header class="flex justify-between px-10 bg-white py-3" id="theHeader"></header>

  <section class="flex h-[89vh] overflow-y-scroll headerBeginner">

    <div class="md:block hidden w-3/12 bg-[#F9FAFB] p-3">

      <div class="flex px-1 h-full">
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv1.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv2.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv2.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv3.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv4.png" />
        </div>
        <div class="mt-5 imgTabs">
          <img src="./assets/img/geninv5.png" />
        </div>
      </div>

    </div>

    <div class="md:w-9/12 w-full bg-[url('./assets/img/slideimg.png')] bg-center overflow-y-scroll">

      <!-- Customer Validation Section -->
      <section class="formTabs h-full">
        <div class="flex justify-center flex-col items-center h-full">
          <form class="md:w-[60%] w-[90%] firstDiv">
            <h1 class="fontBold text-2xl">Customer Validation</h1>
            <p class="mb-3 mt-3">Select your preferred identification method</p>

            <form id="validation-form" class="mt-4">
              <div class="mb-4 flex md:gap-4 gap-3 flex-wrap items-center">
                <div class="form-check mb-2">
                  <input class="form-check-input firstInpts" type="radio" name="identificationMethod" value="tin"
                    id="TIN" checked />
                  <label class="form-check-label" for="TIN">TIN</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input firstInpts  checkUsersApi" type="radio" name="identificationMethod"
                    value="email_or_phone" id="EmailOrPhone" />
                  <label class="form-check-label" for="EmailOrPhone">Email or Phone Number</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input firstInpts" type="radio" name="identificationMethod" value="nin"
                    id="nin" />
                  <label class="form-check-label" for="nin">NIN</label>
                </div>
                <div class="form-check mb-2">
                  <input class="form-check-input firstInpts" type="radio" name="identificationMethod"
                    value="registration_number" id="TaxRegID" />
                  <label class="form-check-label" for="TaxRegID">RC No.</label>
                </div>
              </div>

              <div class="form-group">
                <input type="text" class="form-control mt-1 regInputs" id="validationInput" required />
                <small class="validate text-red-500 hidden"></small>
              </div>

              <div class="flex justify-between pt-3">
                <button type="button" class="button flex items-center gap-x-4 justify-center" id="validate-btn">
                  Validate
                  <iconify-icon icon="material-symbols:line-end-arrow-notch-sharp"></iconify-icon>
                </button>

                <button class="btn outline-btn" id="skip-btn">Fill manually</button>
              </div>
            </form>

            <!-- Taxpayer Summary -->
            <div id="taxpayer-summary" class="hidden md:w-[60%] w-[90%] mt-6 border border-gray-200 rounded-lg p-4">
              <h5 class="text-lg font-semibold mb-3">Taxpayer Information</h5>

              <div id="taxpayer-options" class="mb-4"></div>
              <div id="taxpayer-details" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

              <div class="w-[300px] pt-6">
                <button type="button" class="button flex items-center gap-x-4 justify-center" id="proceed-btn">
                  Proceed
                  <iconify-icon icon="material-symbols:line-end-arrow-notch-sharp"></iconify-icon>
                </button>
              </div>
            </div>

          </form>
        </div>
      </section>

      <!-- Contact Information Section -->
      <section class="formTabs h-full hidden">
        <div class="pt-10 md:px-10 px-4">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>
        <div class="flex justify-center items-center h-full">

          <form action="" class="md:w-[60%] w-[90%] secondForm">
            <h1 class="fontBold text-2xl">Generate Invoice</h1>
            <h1 class="mb-3 mt-3">Personal Details</h1>

            <div class="form-group mb-4">
              <label>Select your category*</label>
              <select class="form-select genInv selCateg" required id="category">
                <option disabled selected>Select--</option>
                <option value="2">Individual</option>
                <option value="1">Corporate</option>
                <option value="3">State Agency</option>
                <option value="4">Federal Agency</option>
                <option value="5">NGO</option>
              </select>
            </div>

            <div class="flex items-center mb-4 gap-2" id="theName">
              <div class="form-group w-full">
                <label for="">First name *</label>
                <input type="text" class="form-control payInputs" required data-name="first_name"
                  placeholder="Enter your first name">
                <small class="validate text-red-500 hidden"></small>
              </div>

              <div class="form-group w-full">
                <label for="">Surname *</label>
                <input type="text" class="form-control payInputs" required data-name="surname"
                  placeholder="Enter your surname">
                <small class="validate text-red-500 hidden"></small>
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2" id="theEmail">
              <div class="form-group w-full">
                <label for="">Email</label>
                <input type="text" class="form-control payInputs" data-name="email"
                  placeholder="Enter your Email Address" id="email">
                <small class="validate text-red-500 hidden"></small>
              </div>

              <div class="form-group w-full">
                <label for="">Phone number *</label>
                <input type="number" class="form-control payInputs" minlength="11" maxlength="11" data-name="phone"
                  id="phone" placeholder="Your 11-digits phone number" required>
                <small class="validate text-red-500 hidden"></small>
              </div>
            </div>

            <div class="flex gap-x-10 pt-2 px-3 md:flex-nowrap sm:flex-wrap">
              <p>Are you a business owner?</p>
              <div class="form-check">
                <input class="form-check-input checki" type="radio" value="yes" name="flexRadioDefault"
                  id="flexRadioDefault1" checked>
                <label class="form-check-label" for="flexRadioDefault1">
                  Yes
                </label>
              </div>
              <div class="form-check">
                <input class="form-check-input checki" type="radio" value="no" name="flexRadioDefault"
                  id="flexRadioDefault2">
                <label class="form-check-label" for="flexRadioDefault2">
                  No
                </label>
              </div>
            </div>

            <div class="mb-4" id="businessType">
              <div class="flex gap-x-10 pt-2 px-3 items-center md:flex-nowrap sm:flex-wrap">
                <p>Type of business*</p>
                <div class="form-group mb-2 md:w-[320px] w-full">
                  <select class="mt-1 payInputs" required data-name="business_type" id="businessTypeSelect">
                    <option value="" selected disabled>-Select the type of the business--</option>
                  </select>
                  <small class="validate text-[red] validate-business"></small>
                </div>
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full" id="theTin">
                <label for="">TIN (Optional)</label>
                <input type="text" class="form-control payInputs" id="tin" data-name="tin" placeholder="Enter your TIN">
              </div>

              <div class="form-group w-full">
                <label for="">State*</label>
                <select name="" id="selectState" class="form-select payInputs" data-name="state" required>
                  <option value="Zamfara">Zamfara</option>
                </select>
                <small class="validate text-red-500 hidden"></small>
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">LGA*</label>
                <select name="" id="selectLGA" class="form-select payInputs" required data-name="lga">
                </select>
                <small class="validate text-red-500 hidden"></small>
              </div>

              <div class="form-group w-full" id="theLga">
                <label for="">Address*</label>
                <input type="text" class="form-control payInputs" minlength="10" required data-name="address"
                  placeholder=" Enter your address">
                <small class="validate text-red-500 hidden"></small>
              </div>
            </div>

            <button class="button w-full" type="button" id="continue-btn-personal">Continue</button>
          </form>

        </div>
      </section>

      <!-- Billing Details Section -->
      <section class="formTabs h-full hidden">
        <div class="pt-10 md:px-10 px-4">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div class="flex justify-center items-center h-full">
          <form class="md:w-[60%] w-[90%] firstDiv">
            <h1 class="fontBold text-2xl">Generate Invoice</h1>
            <p class="mb-3 mt-3">Billing Information</p>


            <div class="row">
              <div class="col-md-6">
                <div class="form-group mb-4">
                  <label for="">LGAs*</label>
                  <select class="form-select genInv" required name="" id="LGAaas">
                    <option disabled selected>Select--</option>
                    <option value="Shinkafi">Shinkafi</option>
                    <option value="Zurmi">Zurmi</option>
                    <option value="Birnin Magaji">Birnin Magaji</option>
                    <option value="Kaura Namoda">Kaura Namoda</option>
                    <option value="Gusau">Gusau</option>
                    <option value="Bungudu">Bungudu</option>
                    <option value="Maru">Maru</option>
                    <option value="Tsafe">Tsafe</option>
                    <option value="Anka">Anka</option>
                    <option value="Bukkuyum">Bukkuyum</option>
                    <option value="Gummi">Gummi</option>
                    <option value="Bakura">Bakura</option>
                    <option value="Maradun">Maradun</option>
                    <option value="Talata Mafara">Talata Mafara</option>
                  </select>
                </div>
              </div>

              <div class="col-md-6">
                <div class="form-group mb-4">
                  <label for="">Zonal Office*</label>
                  <select class="form-select genInv" required name="" id="zonalOff">
                    <option disabled selected>Select--</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="form-group mb-4">
              <label for="selectMdaInput">MDA</label>
              <select name="" id="selectMdaInput" style="width: 100%;">
                <option disabled selected>Select MDA</option>
              </select>
            </div>

            <!-- Payment Items Section -->
            <div id="payment-items-container">
              <div class="flex items-center gap-2 mb-4 itemRow">
                <div class="form-group w-8/12">
                  <label>What do you want to pay for?*</label>
                  <select class="genInv revHeadsss" id="revHeadInputSel" required>
                    <option disabled selected>Select--</option>
                  </select>
                </div>
                <div class="form-group w-4/12">
                  <label>Amount*</label>
                  <input type="text" class="form-control genInv amountTopay h-[40px]" required>
                </div>
              </div>
            </div>

            <div class="flex justify-end mb-4">
              <button type="button" class="textPrimary flex gap-2 items-center" id="add-item-btn">
                <iconify-icon icon="ic:outline-plus"></iconify-icon> Add Item
              </button>
            </div>

            <div class="form-group mb-3">
              <label>Description*</label>
              <input type="text" class="form-control genInv" id="thedescripInput" required>
            </div>

            <button class="button w-full" type="button" id="continue-btn">Continue</button>
          </form>
        </div>
      </section>

      <section class="formTabs h-full hidden">

        <div class="pt-10 md:px-10 px-4">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div class="flex justify-center items-center h-full">
          <form action="" class="md:w-[70%] secondForm">
            <!-- <h1 class="fontBold text-2xl">Generate Invoice</h1> -->
            <h1 class="mb-3 mt-3">Billing Details</h1>
            <div class="shadow-md p-3 bg-[#E9ECEF]" id="bill">
              <div class="flex space-x-3">
                <p></p>
                <p></p>
              </div>
            </div>
            <h1 class="mb-3 mt-3">User Details</h1>

            <div id="userTheName">
              <div class="flex items-center mb-4 gap-2" id="theName">
                <div class="form-group w-full">
                  <label for="">First name</label>
                  <input type="text" class="form-control payInputs2" readonly data-name="first_name">
                </div>

                <div class="form-group w-full">
                  <label for="">Surname</label>
                  <input type="text" class="form-control payInputs2" readonly data-name="surname">
                </div>
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">Email</label>
                <input type="text" class="form-control payInputs2" readonly data-name="email" id="email">
              </div>

              <div class="form-group w-full">
                <label for="">Phone number *</label>
                <input type="text" class="form-control payInputs2" readonly data-name="phone" id="phone">
              </div>
            </div>

            <div class="form-group w-full mb-4">
              <label for="">Type of Business*</label>
              <input type="text" class="form-control payInputs2" readonly data-name="business_type" id="business_type">
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">TIN (Optional)</label>
                <input type="text" class="form-control payInputs2" readonly data-name="tin">
              </div>

              <div class="form-group w-full">
                <label for="">State</label>
                <input type="text" class="form-control payInputs2" readonly data-name="state">
              </div>
            </div>

            <div class="flex items-center mb-4 gap-2">
              <div class="form-group w-full">
                <label for="">LGA</label>
                <input type="text" class="form-control payInputs2" readonly data-name="lga">
              </div>

              <div class="form-group w-full">
                <label for="">Address</label>
                <input type="text" class="form-control payInputs2" readonly data-name="address">
              </div>
            </div>




            <button class="button w-full" type="button" id="generating_inv">Continue</button>
            <div id="msg_box"></div>
          </form>
        </div>
      </section>


      <section class="formTabs pb-5">
        <div class="md:pt-10 pt-3 md:px-10 px-4">
          <!-- <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button> -->
        </div>

        <div class="invoiceContainer flex justify-center">

          <div class="invoice bg-white md:w-[70%] w-[90%] shadow-md md:-mt-12 mt-2" id="invoiceCard">
            <!-- COMING FROM JS invoice.js -->
          </div>


        </div>

        <div class="flex justify-center px-4">
          <div>
            <div class="mt-4">
              <!-- <p class="text-xl">Note: You can make part payment by editing amount you are to pay</p> -->
            </div>
            <div class="flex justify-between flex-wrap mt-4 gap-3">
              <div class="flex gap-3 items-center">
                <button class="outline-btn flex gap-3 items-center px-10" onclick="downloadInvoice('invoiceCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Download Invoice</span>
                </button>

                <button class="outline-btn flex gap-3 items-center px-10" onclick="printInvoice('invoiceCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Print Invoice</span>
                </button>
              </div>

              <button class="button flex gap-3 items-center px-10" onclick="goToPayment2()">
                <span>Proceed</span>
                <iconify-icon icon="eva:arrow-forward-outline" class="text-xl"></iconify-icon>
              </button>
            </div>
          </div>
        </div>



      </section>

      <section class="formTabs pb-5">
        <div class="pt-10 px-10">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div id="makePayment">

          <!-- PAYMENT DESIGN COMING FROM PAYMENT.js -->
        </div>


      </section>

      <section class="formTabs pb-5">
        <div class="pt-10 px-10">
          <button class="flex items-center gap-2" onclick="nextPrev(-1)">
            <iconify-icon icon="eva:arrow-back-outline"></iconify-icon>
            <span>Go back</span>
          </button>
        </div>

        <div class="invoiceContainer flex justify-center pr-10">
          <div class="invoice bg-white md:w-[70%] w-full shadow-md" id="receiptCard">

          </div>
        </div>

        <div class="flex justify-center pr-10">
          <div class="md:w-[70%] w-full">
            <!-- <div class="mt-4">
              <p class="text-xl">Note: You can make part payment by editing amount you are to pay</p>
            </div> -->
            <div class="flex justify-between flex-wrap mt-4">
              <div class="flex gap-3 items-center">
                <button class="outline-btn flex gap-3 items-center px-10" onclick="downloadInvoice('receiptCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Download Receipt</span>
                </button>

                <button class="outline-btn flex gap-3 items-center px-10" onclick="printInvoice('receiptCard')">
                  <iconify-icon icon="mdi:printer-outline" class="text-xl"></iconify-icon>
                  <span>Print Receipt</span>
                </button>
              </div>

              <a href="index.html" class="button flex gap-3 items-center px-10">
                <span>Return to home page</span>
                <iconify-icon icon="eva:arrow-forward-outline" class="text-xl"></iconify-icon>
              </a>
            </div>
          </div>
        </div>



      </section>

    </div>

  </section>
